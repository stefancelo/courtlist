<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="CourtList: Countdown to the next round, arena matchday checklists and fixtures." />
        <meta name="author" content="stefancelo" />
        <link rel="icon" type="image/png" sizes="32x32" href="img/faviconcl.png" />
        <title>Gameweek | CourtList</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
            integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+"
            crossorigin="anonymous" />
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <div id="site-header"></div>

        <main id="main-content" class="container py-4">
            <h1 class="mb-2">Gameweek</h1>
            <p class="text-body-secondary mb-4">
                Everything for the next Euroleague round: time to tip-off, the fixtures and each arena's matchday
                checklist.
                <span class="small">(Sample schedule.)</span>
            </p>

            <!-- Component 1: countdown to the next tip-off -->
            <section class="card mb-4" aria-labelledby="countdown-heading">
                <div class="card-body text-center">
                    <h2 id="countdown-heading" class="h5 mb-1">Next tip-off</h2>
                    <p id="next-game" class="text-body-secondary mb-3"></p>
                    <div id="countdown" class="d-flex justify-content-center gap-2 gap-sm-3" role="timer"></div>
                </div>
            </section>

            <!-- Component 2: fixtures with "create prep task" buttons -->
            <section class="mb-4" aria-labelledby="fixtures-heading">
                <h2 id="fixtures-heading" class="h4 mb-3">Round fixtures</h2>
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th scope="col">Game</th>
                                <th scope="col">Arena</th>
                                <th scope="col">Tip-off</th>
                                <th scope="col" class="text-end">Preparation</th>
                            </tr>
                        </thead>
                        <tbody id="fixtures-body"></tbody>
                    </table>
                </div>
            </section>

            <!-- Component 3: matchday checklists per arena -->
            <section aria-labelledby="checklists-heading">
                <h2 id="checklists-heading" class="h4 mb-3">Matchday checklists</h2>
                <div id="checklists" class="accordion"></div>
            </section>

            <!-- Toast message shown after creating a prep task -->
            <div class="toast-container position-fixed bottom-0 end-0 p-3">
                <div id="gameweek-toast" class="toast" role="status" aria-live="polite" aria-atomic="true">
                    <div class="toast-body d-flex align-items-center gap-2">
                        <i class="bi bi-check-circle text-success" aria-hidden="true"></i>
                        <span id="toast-message"></span>
                        <button
                            type="button"
                            class="btn-close ms-auto"
                            data-bs-dismiss="toast"
                            aria-label="Close"></button>
                    </div>
                </div>
            </div>
        </main>

        <div id="site-footer"></div>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
        <script src="js/storage.js"></script>
        <script src="js/layout.js"></script>
        <script src="js/gameweek.js"></script>
    </body>
</html>
